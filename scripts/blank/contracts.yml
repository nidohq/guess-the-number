# Contracts to build, deploy, and generate clients for. Keys directly under a
# contract are defaults for every network it lists; entries under `networks:`
# override them. A contract only exists on the networks it lists, so building
# another network skips it and leaves it out of the generated clients.
contracts:
  check-in:
    networks:
      local:
        type: workspace
        source: check-in # the crate's package name
      # `npm run deploy:testnet` deploys testnet-dev, then pins the new ID
      # under `testnet:`, the network `npm run dev` uses.
      testnet-dev:
        type: workspace
        source: check-in
