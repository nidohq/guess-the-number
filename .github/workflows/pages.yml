name: Pages

# Builds the app against the shared testnet deployment pinned in scaffold.yml
# and deploys it to GitHub Pages (https://nidohq.github.io/guess-the-number/).
# Repo setting: Pages source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      STELLAR_NETWORK: testnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The toolchain and wasm32v1-none target from rust-toolchain.toml:
      # `clients:testnet` compiles the workspace contracts
      - run: rustup toolchain install
      # Pinned by SHA, so the action can't read the version from its ref
      - uses: stellar/stellar-cli@5a7c5fe76530bf4248477ac812fc757146b98cc4 # v27.0.0
        with:
          version: 27.0.0
      # The README quick start, then the checks
      - run: npm run tools:scaffold
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit
      # Clients for the IDs under `testnet:` in scaffold.yml (no deploy). The
      # throwaway testnet-user it funds with Friendbot lives only in this job.
      - run: npm run clients:testnet
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm run build
        env:
          # "/guess-the-number" on nidohq.github.io; "" behind a custom domain
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          # TEMPORARY: the one-popup approval this app asks for is in Nido's
          # PR preview (https://github.com/nidohq/nido/pull/318). Delete this
          # line when that PR merges and test.nido.fyi serves it; unset, the
          # app uses https://test.nido.fyi.
          PUBLIC_NIDO_BASE: https://318.test.nido.fyi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
